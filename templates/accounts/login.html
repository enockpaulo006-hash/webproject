{% extends 'base.html' %}

{% block title %}Login | Student Market Place{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container auth-card">
        <h1>Login</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</section>
{% endblock %}
